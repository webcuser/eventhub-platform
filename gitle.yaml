{
  "run": "php -S 0.0.0.0:8000 -t backend/public & cd frontend && npm start",
  "port": 3000,
  "build": "cd frontend && npm run build",
  "image": "node:18-bookworm",
  "setup": "apt-get update && apt-get install -y git unzip php && curl -sS https://getcomposer.org/installer | php && mv composer.phar /usr/local/bin/composer && cd backend && composer install && cd ../frontend && npm install",
  "services": [
    "mysql",
    "redis"
  ]
}
